<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fffdfb">
<title>ช่างเม่น Service</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{font-family:'Sarabun','Noto Sans Thai',sans-serif;background:#f3ede3;overscroll-behavior:none;}
input,select,textarea{font-size:16px!important;font-family:'Sarabun','Noto Sans Thai',sans-serif;}
#root{height:100%;}

:root{--a:#d97b29;--as:#fbe3c8;--ad:#c4671f;--ink:#2b2420;--paper:#fffdfb;--line:#e4ddd2;--muted:#8a8077;--good:#2f7d4f;}
*{box-sizing:border-box;}
.app-root{display:flex;flex-direction:column;height:100vh;background:#f3ede3;overflow:hidden;font-family:'Sarabun','Noto Sans Thai',sans-serif;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:56px;background:var(--paper);border-bottom:1px solid var(--line);z-index:20;flex-shrink:0;}
.topbar-title{font-weight:800;font-size:17px;color:var(--ink);}
.topbar-actions{display:flex;gap:8px;align-items:center;}
.tbtn{display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;}
.tbtn-primary{background:var(--a);border-color:var(--a);color:#fff;}
.main-content{flex:1;overflow-y:auto;padding-bottom:80px;}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:10px 18px;border-radius:99px;font-size:13.5px;font-weight:600;z-index:100;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.25);}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:68px;background:var(--paper);border-top:1px solid var(--line);display:flex;z-index:20;}
.bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:none;background:transparent;color:var(--muted);font-family:inherit;font-size:10px;font-weight:600;cursor:pointer;position:relative;padding:0;}
.bnav-btn.active{color:var(--ad);}
.bnav-btn.active svg{stroke:var(--ad);}
.bnav-badge{position:absolute;top:4px;right:calc(50% - 20px);background:var(--a);color:#fff;font-size:9px;font-weight:800;border-radius:99px;padding:1px 5px;min-width:16px;text-align:center;}
.doc-wrap{padding:12px 12px 0;}
.doc-topbar{display:flex;gap:8px;margin-bottom:10px;}
.doc-card{background:var(--paper);border-radius:14px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.06);border:1px solid var(--line);}
.doc-header{background:var(--as);color:var(--ad);text-align:center;font-weight:800;font-size:15px;padding:14px 12px;}
.doc-meta{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px;}
.doc-meta-row2{display:flex;gap:10px;}
.field-group{display:flex;flex-direction:column;gap:4px;}
.field-label{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
.field-input{border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;font-family:inherit;font-size:15px;color:var(--ink);background:#fff;width:100%;}
.field-input:focus{border-color:var(--a);outline:none;}
select.field-input{appearance:auto;}
.field-note{font-size:11px;color:var(--muted);margin-top:-4px;}
.tbl-section-title{padding:10px 14px 6px;font-weight:700;font-size:13px;color:var(--ad);border-top:1px solid var(--line);}
.tbl-scroll{overflow-x:auto;}
.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:420px;}
.tbl thead th{background:var(--as);color:var(--ad);padding:8px 7px;font-weight:700;font-size:12px;text-align:left;border-bottom:1px solid var(--line);}
.tbl td{padding:7px 7px;border-bottom:1px solid var(--line);vertical-align:middle;}
.center{text-align:center;}.right{text-align:right;}.bold{font-weight:700;}
.cell-input{width:100%;border:none;background:transparent;font-family:inherit;font-size:13px;padding:3px 4px;color:var(--ink);min-width:60px;}
.cell-input:focus{background:#faf7f2;border-radius:4px;outline:none;}
.th-input{width:100%;background:transparent;border:1px solid transparent;font-family:inherit;font-size:12px;font-weight:700;color:var(--ad);padding:1px 3px;border-radius:3px;}
.th-input:focus{border-color:var(--a);background:#fff;color:var(--ink);outline:none;}
.th-input.center{text-align:center;}.th-input.right{text-align:right;}
.sub-row td{background:#f7f2ea;font-size:12.5px;padding:6px 7px;}
.total-row td{background:var(--a);color:#fff;font-weight:800;padding:9px 7px;}
.add-row-btn{display:flex;align-items:center;gap:6px;background:none;border:none;color:var(--ad);font-weight:700;font-size:13px;cursor:pointer;padding:10px 14px;font-family:inherit;}
.eq-add-btn{display:flex;align-items:center;gap:7px;background:none;border:1.5px dashed var(--a);color:var(--ad);font-weight:700;font-size:13px;cursor:pointer;padding:10px 14px;margin:10px 14px;border-radius:8px;font-family:inherit;}
.eq-section{border-top:2px solid var(--as);}
.eq-header{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;background:var(--as);font-weight:700;font-size:13.5px;color:var(--ad);}
.icon-btn{border:none;background:#f1ece3;color:var(--muted);width:32px;height:32px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
.icon-btn.danger:hover{background:#fbdede;color:#b3261e;}
.notes-section{padding:12px 14px;border-top:1px solid var(--line);}
.notes-title{font-weight:700;color:var(--ad);margin-bottom:8px;font-size:13.5px;}
.note-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.pay-header{background:var(--a);color:#fff;text-align:center;font-weight:800;padding:9px;font-size:14px;}
.pay-body{padding:14px;text-align:center;color:#1d4ed8;font-size:13.5px;line-height:1.8;}
.pay-strong{font-weight:800;margin-top:4px;}
.sm-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;}
.sm-btn-active{background:var(--as);color:var(--ad);border-color:var(--a);}
.rc-header-blk{background:#1a1a1a;display:flex;align-items:center;justify-content:space-between;padding:16px 18px;}
.rc-brand{display:flex;align-items:center;gap:10px;}
.rc-mark{width:40px;height:40px;border-radius:10px;background:var(--a);color:#fff;font-weight:900;font-size:20px;display:flex;align-items:center;justify-content:center;}
.rc-name{color:#fff;font-weight:800;font-size:16px;}
.rc-sub{color:#aaa;font-size:11px;margin-top:2px;}
.rc-title-blk{text-align:right;}
.rc-th{color:#fff;font-weight:900;font-size:22px;line-height:1;}
.rc-en{color:var(--a);font-weight:700;font-size:11px;letter-spacing:3px;margin-top:2px;}
.rc-footer-blk{display:flex;justify-content:space-between;align-items:flex-end;padding:14px 16px;border-top:2px solid var(--line);flex-wrap:wrap;gap:12px;}
.rc-sign{text-align:center;}
.rc-thanks{background:var(--as);text-align:center;padding:10px;font-size:13px;font-weight:600;color:var(--ad);}
.rc-print-only{display:none;font-weight:700;color:var(--ink);}
.war-fields{padding:12px;margin-bottom:12px;background:var(--paper);border-radius:14px;border:1px solid var(--line);}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.wc-card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.1);border:2px solid #1a1a1a;}
.wc-head{background:#1a1a1a;display:flex;align-items:center;position:relative;overflow:hidden;}
.wc-brand-blk{padding:16px 18px 16px 20px;border-right:2px solid #333;}
.wc-thai{color:#fff;font-weight:900;font-size:20px;line-height:1.1;}
.wc-en{color:var(--a);font-weight:700;font-size:17px;font-style:italic;}
.wc-title-blk{padding:16px 20px;flex:1;}
.wc-doc{color:#fff;font-weight:900;font-size:24px;line-height:1;}
.wc-job{color:#aaa;font-size:12px;margin-top:3px;font-weight:600;}
.wc-deco{position:absolute;right:0;top:0;bottom:0;width:80px;background:linear-gradient(135deg,transparent 40%,var(--a) 40%,var(--a) 60%,transparent 60%);}
.wc-body{display:flex;padding:18px;gap:12px;flex-wrap:wrap;}
.wc-info{flex:1;min-width:180px;display:flex;flex-direction:column;gap:11px;}
.wc-row{display:flex;gap:8px;align-items:baseline;}
.wc-lbl{color:#888;font-size:12px;font-weight:600;min-width:80px;}
.wc-val{color:#1a1a1a;font-size:14px;font-weight:700;}
.wc-badge-wrap{display:flex;flex-direction:column;align-items:center;gap:8px;}
.wc-badge{background:#1a1a1a;border-radius:50% 50% 44% 44%/40% 40% 30% 30%;width:120px;height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:3px solid #fff;box-shadow:0 0 0 3px #1a1a1a;}
.wc-stars{color:var(--a);font-size:12px;letter-spacing:3px;margin-bottom:2px;}
.wc-b-lbl{font-size:10px;font-weight:700;color:#ccc;}
.wc-b-num{font-size:44px;font-weight:900;color:var(--a);line-height:1;}
.wc-b-unit{font-size:12px;font-weight:700;color:#ccc;}
.wc-note{background:#fff;border:2px solid #1a1a1a;border-radius:8px;padding:6px 10px;font-size:12px;text-align:center;color:#1a1a1a;font-weight:700;max-width:130px;}
.wc-foot{background:#1a1a1a;display:flex;align-items:center;justify-content:space-between;padding:10px 18px;gap:12px;flex-wrap:wrap;}
.hist-root{padding:12px 12px 0;}
.hist-search-wrap{position:relative;margin-bottom:10px;}
.hist-search{width:100%;padding:11px 40px 11px 14px;border:1.5px solid var(--line);border-radius:10px;font-family:inherit;font-size:15px;color:var(--ink);background:#fff;}
.hist-search:focus{border-color:var(--a);outline:none;}
.hist-clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:none;background:none;color:var(--muted);cursor:pointer;display:flex;align-items:center;padding:6px;}
.hist-tabs{display:flex;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:10px;}
.hist-tab{flex:1;padding:9px 6px;border:none;background:transparent;font-family:inherit;font-size:11.5px;font-weight:700;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;border-right:1px solid var(--line);}
.hist-tab:last-child{border-right:none;}
.hist-tab.active{background:var(--as);color:var(--ad);}
.hist-tab-cnt{background:#e4ddd2;color:var(--muted);border-radius:99px;padding:1px 5px;font-size:10px;font-weight:800;}
.hist-tab.active .hist-tab-cnt{background:var(--a);color:#fff;}
.hist-new-row{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;}
.hist-new-btn{display:inline-flex;align-items:center;gap:5px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;}
.hist-list{display:flex;flex-direction:column;gap:8px;}
.hist-card{background:#fff;border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;overflow:hidden;}
.hist-card-body{flex:1;padding:12px 14px;cursor:pointer;min-width:0;}
.hist-card-top{display:flex;align-items:center;gap:6px;margin-bottom:5px;flex-wrap:wrap;}
.hist-badge{padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;}
.hist-doc{font-size:11px;color:var(--muted);}
.hist-date{font-size:11px;color:var(--muted);margin-left:auto;}
.hist-name{font-weight:800;font-size:14.5px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hist-sub{font-weight:700;font-size:13px;}
.hist-actions{display:flex;flex-direction:column;gap:6px;padding:10px;border-left:1px solid var(--line);background:#faf7f2;}
.rp-root{padding:12px;}
.rp-periods{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.rp-period-btn{padding:8px 14px;border-radius:99px;border:1.5px solid var(--line);background:#fff;color:var(--muted);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;}
.rp-period-btn.active{background:var(--a);border-color:var(--a);color:#fff;}
.rp-kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.rp-kpi-card{background:#fff;border-radius:12px;padding:14px;border:1px solid var(--line);}
.rp-kpi-label{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:6px;}
.rp-kpi-val{font-size:22px;font-weight:900;line-height:1.1;}
.rp-kpi-sub{font-size:11.5px;color:var(--muted);margin-top:3px;}
.rp-section{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;border:1px solid var(--line);}
.rp-section-title{font-weight:800;font-size:14px;color:var(--ink);margin-bottom:14px;}
.rp-chart{display:flex;align-items:flex-end;gap:6px;height:120px;padding-top:20px;}
.rp-bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;}
.rp-bar-val{font-size:10px;color:var(--muted);font-weight:600;height:14px;text-align:center;}
.rp-bar-wrap{flex:1;width:100%;display:flex;align-items:flex-end;}
.rp-bar{width:100%;border-radius:4px 4px 0 0;}
.rp-bar-label{font-size:10px;color:var(--muted);font-weight:600;}
.rp-cust-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);}
.rp-cust-row:last-child{border-bottom:none;}
.rp-cust-rank{width:24px;height:24px;border-radius:99px;background:var(--as);color:var(--ad);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.rp-cust-info{flex:1;min-width:0;}
.rp-cust-name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rp-cust-sub{font-size:11.5px;color:var(--muted);}
.rp-cust-amount{font-weight:800;font-size:13.5px;color:var(--good);white-space:nowrap;}
.rp-pay-grid{display:flex;gap:8px;flex-wrap:wrap;}
.rp-pay-card{background:var(--as);border-radius:8px;padding:10px 14px;text-align:center;}
.rp-pay-count{font-size:22px;font-weight:900;color:var(--ad);}
.rp-pay-method{font-size:12px;font-weight:600;color:var(--muted);}
.settings-root{padding:12px;display:flex;flex-direction:column;gap:14px;}
.settings-back{display:flex;align-items:center;gap:12px;}
.settings-section-title{font-weight:800;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:4px;}
.settings-form{background:#fff;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line);}
.backup-btn{display:flex;align-items:center;gap:10px;padding:13px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--as);color:var(--ad);font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;width:100%;}
.settings-hint{font-size:12px;color:var(--muted);line-height:1.6;margin:0;}
.empty-state{text-align:center;padding:60px 20px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:8px;}
.empty-state p{font-weight:700;color:var(--ink);margin:4px 0 0;font-size:15px;}
.empty-state span{font-size:13px;}
/* signature pad */
.sig-section{padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;}
.sig-trigger-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;}
.sig-label-below{font-size:11.5px;color:var(--muted);font-weight:600;}
.sig-open-btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:9px;border:1.5px dashed var(--a);background:var(--as);color:var(--ad);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;}
.sig-open-btn:hover{background:#f7dbb8;}
.sig-preview-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;}
.sig-preview-img{height:56px;max-width:160px;object-fit:contain;border:1px solid var(--line);border-radius:6px;background:#fff;padding:4px;}
.sig-preview-actions{display:flex;gap:6px;}
.sig-edit-btn{border:1px solid var(--line);background:#fff;color:var(--muted);font-family:inherit;font-size:12px;font-weight:600;padding:4px 10px;border-radius:6px;cursor:pointer;}
.sig-edit-btn:hover{background:#f1ece3;}
.sig-del-btn:hover{background:#fbdede;color:#b3261e;border-color:#f5c6c6;}
.sig-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px;}
.sig-modal{background:#fff;border-radius:16px;width:100%;max-width:560px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.3);}
.sig-modal-head{display:flex;align-items:center;justify-content:space-between;}
.sig-close-btn{border:none;background:#f1ece3;color:var(--muted);width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.sig-hint{font-size:13px;color:var(--muted);margin:0;}
.sig-canvas{width:100%;border:2px solid var(--line);border-radius:10px;cursor:crosshair;background:#fafafa;touch-action:none;display:block;}
.sig-modal-foot{display:flex;gap:10px;justify-content:flex-end;}
.sig-clear-btn{padding:9px 16px;border-radius:8px;border:1.5px solid var(--line);background:#fff;color:var(--muted);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;}
.sig-clear-btn:hover{background:#f1ece3;}
.sig-save-btn{padding:9px 18px;border-radius:8px;border:none;background:var(--a);color:#fff;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;}
.sig-save-btn:hover{background:var(--ad);}
.merge-btn{border:1px solid var(--line);background:#fff;color:var(--muted);width:26px;height:22px;border-radius:5px;font-size:13px;display:flex;align-items:center;justify-content:center;cursor:pointer;line-height:1;}
.merge-btn-on{background:#fff8e0;border-color:#e0b020;color:#b06000;}
.merge-btn:hover{background:#f7f2ea;}
@media print{
  .no-print{display:none!important;}
  .rc-print-only{display:block!important;}
  body,html{background:#fff!important;}
  .app-root{height:auto;overflow:visible;}
  .main-content{overflow:visible;padding-bottom:0;}
  .doc-wrap{padding:0;}
  .doc-card,.wc-card{box-shadow:none;border-radius:0;border:none;max-width:100%;}
  .field-input,.cell-input,.th-input{border:none!important;background:transparent!important;}
  .sig-open-btn,.sig-preview-actions{display:none!important;}
  .sig-preview-img{border:none!important;padding:0!important;}
  .sig-section{padding:8px 16px;}
  .tbl-scroll{overflow:visible;}
  .wc-card{border-radius:8px;border:2px solid #1a1a1a!important;}
  .war-fields{display:none!important;}
}
@media(min-width:640px){
  .rp-kpi-grid{grid-template-columns:repeat(4,1fr);}
  .field-grid{grid-template-columns:repeat(3,1fr);}
  .doc-wrap,.hist-root,.rp-root,.settings-root{max-width:800px;margin:0 auto;padding:16px 16px 0;}
  .rp-kpi-val{font-size:26px;}
}

</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script>
(function(){
"use strict";

// ── Error display ──────────────────────────────────────────
window.onerror = function(msg, src, line, col, err) {
  document.getElementById('root').innerHTML =
    '<div style="padding:24px;font-family:Sarabun,sans-serif;color:#b3261e;background:#fff;min-height:100vh">' +
    '<h2>❌ เกิดข้อผิดพลาด</h2><pre style="font-size:13px;white-space:pre-wrap">' +
    (err ? err.stack : msg) + '</pre></div>';
  return false;
};

// ── React hooks ────────────────────────────────────────────

function SignaturePad({value,onChange,label="ลายเซ็น"}){
  const canvasRef=useRef();
  const drawing=useRef(false);
  const last=useRef(null);
  const [open,setOpen]=useState(false);
  const [hasSig,setHasSig]=useState(!!value);

  useEffect(()=>{
    if(!open) return;
    const cvs=canvasRef.current; if(!cvs) return;
    const ctx=cvs.getContext("2d");
    ctx.clearRect(0,0,cvs.width,cvs.height);
    if(value){const img=new Image();img.onload=()=>ctx.drawImage(img,0,0);img.src=value;}
  },[open]);

  function getPos(e,cvs){
    const r=cvs.getBoundingClientRect();
    const src=e.touches?e.touches[0]:e;
    return {x:(src.clientX-r.left)*(cvs.width/r.width),y:(src.clientY-r.top)*(cvs.height/r.height)};

    ctx.strokeStyle="#1a1a2e";ctx.lineWidth=2.5;ctx.lineCap="round";ctx.lineJoin="round";ctx.stroke();
